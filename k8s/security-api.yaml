apiVersion: apps/v1
kind: Deployment
metadata: {name: security-api}
spec:
  selector: {matchLabels: {app: security-api}}
  template:
    metadata: {labels: {app: security-api}}
    spec:
      containers:
        - name: api
          image: your-registry/ai-security-platform:1.0.0
          ports: [{containerPort: 8080}]
          env:
            - {name: KAFKA_BOOTSTRAP, value: "redpanda:9092"}
            - {name: USE_KAFKA, value: "true"}
            - {name: ENFORCEMENT_MODE, value: "require-approval"}
          resources:
            requests: {cpu: "200m", memory: "256Mi"}
            limits: {cpu: "1", memory: "1Gi"}
          readinessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 5, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /health, port: 8080}, initialDelaySeconds: 15, periodSeconds: 10}
---
apiVersion: v1
kind: Service
metadata: {name: security-api}
spec:
  selector: {app: security-api}
  ports: [{port: 80, targetPort: 8080}]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: security-api}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: security-api}
  minReplicas: 2
  maxReplicas: 10
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 65}
