services:
  redpanda:
    image: redpandadata/redpanda:v25.2.3
    command: ["redpanda","start","--overprovisioned","--smp","1","--memory","512M","--reserve-memory","0M","--node-id","0","--check=false","--kafka-addr","PLAINTEXT://0.0.0.0:9092,OUTSIDE://0.0.0.0:19092","--advertise-kafka-addr","PLAINTEXT://redpanda:9092,OUTSIDE://localhost:19092"]
    ports: ["19092:19092"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health --brokers=localhost:9092 | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 3s
      retries: 20
  console:
    image: redpandadata/console:v3.2.2
    environment: ["KAFKA_BROKERS=redpanda:9092"]
    ports: ["8081:8080"]
    depends_on: {redpanda: {condition: service_healthy}}
  security-api:
    build: .
    environment:
      KAFKA_BOOTSTRAP: redpanda:9092
      TELEMETRY_TOPIC: security.telemetry
      USE_KAFKA: "true"
      ENFORCEMENT_MODE: simulate
      DB_PATH: /data/security.db
    volumes: ["security_data:/data"]
    ports: ["8080:8080"]
    depends_on: {redpanda: {condition: service_healthy}}
volumes: {security_data: {}}
